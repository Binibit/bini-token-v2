[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = false
extra_output = ["storageLayout"]
build_info = true
ast = true
ffi = false

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = true
