name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run local tests
        run: forge test --no-match-path "test/fork/*" -vvv

      - name: Run mainnet-fork tests
        run: forge test --match-path "test/fork/*" -vvv

      - name: Validate JSON artifacts
        run: >-
          jq empty
          artifacts/release/BINI_V2_BUILD.json
          artifacts/release/BINI_V2_CORE_ABI.json
          artifacts/release/BINI_V2_CORE_SELECTORS.json
          artifacts/release/BINI_V2_CORE_STORAGE.json
          config/governance-manifest.rehearsal.json
          policy/allowed-selectors.json
          policy/prohibited-selectors.json
