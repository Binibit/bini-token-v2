name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINI_EVIDENCE_DIR: /tmp/bini-v2-release-evidence
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: 1.5.1

      - name: Install validation tools
        run: |
          npm ci --ignore-scripts
          pipx install slither-analyzer==0.11.4
          python3 -m pip install --user -r requirements-release.txt

      - name: Prepare release evidence
        run: mkdir -p "$BINI_EVIDENCE_DIR"

      - name: Run receipt-backed Anvil release rehearsal
        run: tools/test-release-anvil.sh 2>&1 | tee "$BINI_EVIDENCE_DIR/anvil-rehearsal.log"

      - name: Run RC3A real-Safe lifecycle rehearsal
        run: tools/test-rc3a-anvil.sh 2>&1 | tee "$BINI_EVIDENCE_DIR/rc3a-anvil-rehearsal.log"

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: |
          forge build --sizes 2>&1 | tee "$BINI_EVIDENCE_DIR/build.log"
          tools/export-ci-build-evidence.sh

      - name: Validate UUPS implementation
        run: npm run validate:upgrades 2>&1 | tee "$BINI_EVIDENCE_DIR/uups-validation.log"

      - name: Run static analysis
        run: >-
          slither .
          --filter-paths 'lib|test|script'
          --exclude-dependencies
          --exclude assembly,low-level-calls,unindexed-event-address
          --json "$BINI_EVIDENCE_DIR/slither-report.json"
          2>&1 | tee "$BINI_EVIDENCE_DIR/slither.log"

      - name: Check release artifacts and selector policy
        run: tools/release-artifacts.sh check 2>&1 | tee "$BINI_EVIDENCE_DIR/release-artifacts.log"

      - name: Run local tests
        run: forge test --no-match-path "test/fork/*" -vv 2>&1 | tee "$BINI_EVIDENCE_DIR/solidity-tests.log"

      - name: Run release CLI tests
        run: python3 -m unittest discover -s test_cli -p 'test_*.py' -v 2>&1 | tee "$BINI_EVIDENCE_DIR/cli-tests.log"

      - name: Run pinned mainnet-fork tests
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: tools/test-mainnet-fork.sh 2>&1 | tee "$BINI_EVIDENCE_DIR/fork-tests.log"

      - name: Enforce core coverage
        run: |
          tools/coverage-gate.sh 2>&1 | tee "$BINI_EVIDENCE_DIR/coverage.log"
          cp lcov.info "$BINI_EVIDENCE_DIR/coverage.lcov"

      - name: Check dependency advisories
        run: npm audit --audit-level=high 2>&1 | tee "$BINI_EVIDENCE_DIR/npm-audit.log"

      - name: Validate JSON
        run: >-
          jq empty
          BINI_V2_PHASE1_RELEASE_MANIFEST.json
          artifacts/release/*.json
          artifacts/examples/*.json
          artifacts/sepolia/phase1/*.json
          config/*.json
          data/*.json
          policy/*.json

      - name: Validate RC3 receipt schemas
        run: python3 tools/validate-rc3-schemas.py artifacts/anvil-rc3a

      - name: Seal exact-SHA release evidence
        run: tools/finalize-ci-evidence.sh

      - name: Upload immutable release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bini-v2-release-evidence-${{ github.sha }}
          path: /tmp/bini-v2-release-evidence
          if-no-files-found: error
          retention-days: 90
